[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-worker"
version = "0.1.0"
description = "Multi-agent AI estimation system for remodeling and construction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # Agent orchestration
    "crewai>=1.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # LLM providers
    "anthropic>=0.40.0",
    "httpx>=0.27.0",

    # RAG pipeline
    "llama-index>=0.11.0",
    "llama-index-vector-stores-qdrant>=0.3.0",
    "llama-index-embeddings-ollama>=0.3.0",
    "qdrant-client>=1.12.0",
    "docling>=2.0.0",

    # Vision pipeline
    "Pillow>=10.0",
    "transformers>=4.45.0",
    "torch>=2.0",

    # Cost engine ML
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.5",
    "shap>=0.45",
    "numpy>=1.26",
    "pandas>=2.2",

    # MCP servers
    "mcp>=1.0.0",

    # Database
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "redis>=5.0",

    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "types-PyYAML",
    "types-redis",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
